name: Release Windows installer

# Builds the NSIS installer on Windows, smoke-tests the installed app, signs the installer through SignPath once
# that is set up, and attaches it to a GitHub release with SHA256SUMS.txt, which the one-command installer
# (install.ps1) checks before it installs anything.
# Runs when a version tag (v*) is pushed, or manually for an existing tag.
# Pull requests that touch packaging build the installer as a check, without releasing.
on:
  push:
    tags: ['v*']
  pull_request:
    paths:
      - 'package.json'
      - 'bun.lock'
      - 'build.ts'
      - 'electron/**'
      - 'static/icon.*'
      - 'tests/build/**'
      - '.github/scripts/**'
      - '.github/workflows/release.yml'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build and release (e.g. v1.1.0)'
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
      # electron-builder doesn't sign: SignPath signs after the build (below), so don't look for a certificate.
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - name: Check tag matches package.json version
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "$TAG" ]; then
            echo "::error::Tag $TAG does not match package.json version $version"
            exit 1
          fi
      # Same install as check.yml (frozen bun.lock). Electron's own postinstall is skipped; electron-builder downloads Electron itself.
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: npm run check
      - run: npm test
      - run: bun run build
      - name: Build installer
        run: npx electron-builder --win nsis --x64 --publish never
      # Install the NSIS installer silently and boot the installed app (HERMES_BOTS_SMOKE=1); no release without HERMES_BOTS_SMOKE_OK.
      - name: Smoke-test the installed app
        shell: bash
        run: .github/scripts/smoke-windows-installer.sh
      # Signing runs after the smoke test, by SignPath Foundation. It only runs once the project's SignPath setup
      # exists (the repository variable SIGNPATH_ORGANIZATION_ID); until then the release stays unsigned.
      - name: Upload unsigned installer for signing
        if: vars.SIGNPATH_ORGANIZATION_ID != ''
        id: upload-unsigned
        uses: actions/upload-artifact@v4
        with:
          name: hermes-bots-unsigned-installer
          path: dist/NexurBots-Setup-*.exe
          retention-days: 1
      - name: Sign installer with SignPath
        if: vars.SIGNPATH_ORGANIZATION_ID != ''
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: nexur-bots
          signing-policy-slug: release-signing
          github-artifact-id: ${{ steps.upload-unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed
      - name: Put the signed installer in dist
        if: vars.SIGNPATH_ORGANIZATION_ID != ''
        shell: bash
        run: |
          mapfile -t signed < <(find signed -type f -name 'NexurBots-Setup-*.exe')
          if [ ${#signed[@]} -ne 1 ]; then echo "::error::Expected one signed installer, found ${#signed[@]}"; exit 1; fi
          mv -f "${signed[0]}" dist/
      # Written after signing, so the checksums are for the installer that is released, signed or not.
      # install.ps1 won't install a download whose hash isn't in SHA256SUMS.txt.
      - name: Checksums
        shell: bash
        run: |
          cd dist
          sha256sum NexurBots-Setup-*.exe > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: List artifacts
        shell: bash
        run: ls -la dist
      # A full artifact-storage quota must not fail the build (or block the release step below):
      # the artifact is a convenience copy, the release asset is the real output.
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: hermes-bots-windows-installer
          path: |
            dist/*.exe
            dist/*.blockmap
            dist/latest*.yml
            dist/SHA256SUMS.txt
          retention-days: 14
      - name: Create or update GitHub release
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          # Globs only: with nullglob a pattern that matches nothing drops out (latest.yml is only written when publishing is configured).
          files=(dist/*.exe dist/*.exe.blockmap dist/latest*.yml dist/SHA256SUMS.txt)
          if [ ${#files[@]} -eq 0 ]; then echo "::error::No installer found in dist/"; exit 1; fi
          notes_file=.github/release-notes/$TAG.md
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${files[@]}" --clobber
          elif [ -f "$notes_file" ]; then
            gh release create "$TAG" "${files[@]}" --title "NexurBots $TAG" --notes-file "$notes_file" --verify-tag
          else
            gh release create "$TAG" "${files[@]}" --title "NexurBots $TAG" --generate-notes --verify-tag
          fi
